<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лаборатори 02 - Семантик бүртгэлийн форм</title>
</head>
<body>

  <!-- 1. Семантик бүтэц: header -->
  <header>
    <h1>Сургуулийн бүртгэлийн систем</h1>
    <p>Доорх формоор дамжуулан мэдээллээ үнэн зөв заавал бөглөнө үү.</p>
  </header>

  <!-- 1. Семантик бүтэц: main -->
  <main>
    <section>
      <h2>Оюутны анкет</h2>

      <!-- 2. Форм үүсгэх -->
      <form action="#" method="POST">
        
        <!-- 3, 4, 5. Нэр: type="text", label for/id холбосон, required -->
        <div>
          <label for="fullname">Овог нэр:</label><br>
          <input type="text" id="fullname" name="fullname" placeholder="Жишээ: Бат Болд" required>
        </div>
        <br>

        <!-- 3, 4, 5. Имэйл: type="email", pattern валидаци -->
        <div>
          <label for="email">Цахим шуудан:</label><br>
          <input type="email" id="email" name="email" placeholder="student@example.com" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>
        </div>
        <br>

        <!-- 3, 4, 5. Нууц үг: type="password", minlength валидаци -->
        <div>
          <label for="password">Нууц үг:</label><br>
          <input type="password" id="password" name="password" placeholder="Адаглаад 8 тэмдэгт" minlength="8" required>
        </div>
        <br>

        <!-- 3, 4. Төрсөн огноо: type="date" -->
        <div>
          <label for="dob">Төрсөн огноо:</label><br>
          <input type="date" id="dob" name="dob" required>
        </div>
        <br>

        <!-- 3, 4. Хүйс: type="radio" -->
        <div>
          <label>Хүйс:</label><br>
          <input type="radio" id="male" name="gender" value="male" required>
          <label for="male">Эрэгтэй</label>
          
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Эмэгтэй</label>
        </div>
        <br>

        <!-- 3, 4. Мэргэжил: <select> сонголт -->
        <div>
          <label for="major">Суралцаж буй чиглэл:</label><br>
          <select id="major" name="major" required>
            <option value="">-- Сонгоно уу --</option>
            <option value="it">Мэдээллийн технологи</option>
            <option value="cs">Компьютерийн ухаан</option>
            <option value="se">Програм хангамж</option>
          </select>
        </div>
        <br>

        <!-- 3, 4. Сонирхол: type="checkbox" -->
        <div>
          <label>Сонирхол / Сонирхдог чиглэл:</label><br>
          <input type="checkbox" id="web" name="interests" value="web">
          <label for="web">Веб хөгжүүлэлт</label><br>

          <input type="checkbox" id="mobile" name="interests" value="mobile">
          <label for="mobile">Мобайл апп</label><br>

          <input type="checkbox" id="ai" name="interests" value="ai">
          <label for="ai">Искусственный интеллект / AI</label>
        </div>
        <br>

        <button type="submit">Бүртгүүлэх</button>
      </form>
    </section>
  </main>

  <!-- 1. Семантик бүтэц: footer -->
  <footer>
    <p>&copy; 2026 Вэб зохиомж лаборатори 2.</p>
  </footer>

</body>
</html>
